plugins {
    // Автопровижининг JDK toolchains (нужен для модулей на Java 17/21/25).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Mojang'
            url = 'https://libraries.minecraft.net/'
        }
    }
}

rootProject.name = 'myoptimize-ultra'

// Все версии Minecraft от 1.20 до 26.3. Каждая — отдельный gradle-модуль
// (versions/v<версия>/gradle.properties) со своими зависимостями.
// Группы (era) отличаются только набором миксин-variant'ов — см. MULTIVERSION_PLAN.md.
def mcVersions = [
    // era g1: 1.20–1.20.4 (Java 17)
    '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4',
    // era g2: 1.20.5–1.21.1 (Java 21)
    '1.20.5', '1.20.6', '1.21', '1.21.1',
    // era g3: 1.21.2–1.21.4 (Java 21, ChunkBuilder со scheduleUpload)
    '1.21.2', '1.21.3', '1.21.4',
    // era g4: 1.21.5–1.21.11 (Java 21, ChunkBuilder без scheduleUpload)
    '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
    // mojmap: 26.x (Java 25, без обфускации — officialMojangMappings)
    '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
]

mcVersions.each { v ->
    include "v${v}"
    project(":v${v}").projectDir = file("versions/v${v}")
}
